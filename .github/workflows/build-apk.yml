name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore update signing key
        id: signing
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.USER_TAP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::USER_TAP_KEYSTORE_BASE64 is required for releases'
            exit 1
          fi
          mkdir -p signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > signing/local.keystore
          echo 'mode=update' >> "$GITHUB_OUTPUT"
      - name: Build and verify APK
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: user-tap-${{ steps.signing.outputs.mode || 'test' }}-apk
          path: build/user-tap.apk
          if-no-files-found: error
      - name: Publish dated release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_date=$(date -u +%Y-%m-%d)
          tag="v${release_date}.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" build/user-tap.apk \
            --target "$GITHUB_SHA" \
            --title "$release_date (build $GITHUB_RUN_NUMBER)" \
            --generate-notes
